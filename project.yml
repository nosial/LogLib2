source: src/LogLib2
default_build: release
update_source: nosial/loglib2@n64
repository:
  name: n64
  type: github
  host: git.n64.cc
  ssl: true
assembly:
  name: LogLib2
  package: net.nosial.loglib2
  version: 1.0.9
  url: 'https://github.com/nosial/LogLib2'
  license: 'MIT'
  description: 'A logging library for php/ncc to log events in PHP applications'
  author: 'Netkas <netkas@nosial.net>'
  organization: 'Nosial'
  product: 'Libraries'
  copyright: 'Copyright (c) 2022-2026 Nosial'
dependencies:
  net.nosial.optslib: nosial/optslib@github
build_configurations:
  -
    name: release
    output: 'target/release/${ASSEMBLY.PACKAGE}.ncc'
    type: ncc
  -
    name: debug
    output: 'target/debug/${ASSEMBLY.PACKAGE}.ncc'
    type: ncc
    definitions:
      DEBUG: '1'
